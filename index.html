
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Result Management System</h1>

    <div class="form">

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter Student Name">

        <label>Roll Number</label>
        <input type="text" id="rollNumber" placeholder="Enter Roll Number">

        <h3>Enter Subject Marks</h3>

        <label>English</label>
        <input type="number" id="english" placeholder="Enter English Marks">

        <label>Math</label>
        <input type="number" id="math" placeholder="Enter Math Marks">

        <label>Computer</label>
        <input type="number" id="computer" placeholder="Enter Computer Marks">

        <label>Physics</label>
        <input type="number" id="physics" placeholder="Enter Physics Marks">

        <label>Chemistry</label>
        <input type="number" id="chemistry" placeholder="Enter Chemistry Marks">

        <button onclick="calculateResult()">Calculate Result</button>

    </div>

    <div id="result" class="result"></div>

</div>

<script src="script.js"></script>

</body>
</
